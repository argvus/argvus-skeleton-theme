# Theme: Skeleton
# Template manifest for /usr/share/argvus/appearance/themes.d/<id>/theme.toml.
# Hand-maintained: create a new theme with tools/sh/new_theme.sh, then replace
# every TODO(palette) value with the official palette. See DEVELOPMENT.md.

id = "skeleton"
name = "Skeleton"
category = "light"
accent = "#808080"
# TODO(palette): ship this file under src/usr/share/backgrounds/argvus/ (or
# point to an existing argvus-wallpapers file). Installation fails validation
# until the wallpaper it names is part of the payload.
wallpaper = "abstract/light/skeleton-abstract-light.jxl"

[name_i18n]
en-US = "Skeleton"
pt-BR = "Skeleton"

[palette]
# RGB hex colors for splash and greeter rendering
# bg: background color, fg: foreground, accent: highlight
# TODO(palette): replace these neutral placeholders with the official palette.
# qt6ct colors (src/.../qt6ct/colors/*.conf) must be updated with them.
bg = "#808080"
fg = "#000000"
accent = "#808080"

[appearance]
# GTK theme mapping (Adwaita|Adwaita-dark)
gtk_scheme = "prefer-light"

# Background color for effects/wallpaper fallback
background = "#808080"

# Calendar stylesheet name, shipped by this package as etc/.../calendar/themes/<name>.css
calendar_css = "skeleton"

# Removable devices stylesheet name. Resolved by theme-switch.sh against the
# argvus package, which ships argvus-light.css and argvus-dark.css under
# /usr/share/argvus/removable-devices/config/themes. Use a shipped name here
# unless this package ships its own.
removable_devices_css = "argvus-light"

[aliases]
# Legacy theme ID mappings (if any) - format: "old-id" = "skeleton"

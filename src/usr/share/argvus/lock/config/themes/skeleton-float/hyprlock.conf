# Theme: skeleton-float
background { monitor =; path = ~/.cache/argvus/hypr/hyprlock-wallpaper-blur.png; blur_size = 3; blur_passes = 3; brightness = 0.55 }
input-field { monitor =; size = 280, 45; outline_thickness = 1; outer_color = rgb(808080); inner_color = rgb(808080); font_color = rgb(808080); placeholder_text = <i><span font_family='Symbols Nerd Font Mono'></span>  __ARGVUS_LOCK_PASSWORD__</i>; position = 0, -100; halign = center; valign = center; rounding = 6 }
shape { monitor =; size = 320, 150; color = rgba(128, 128, 128, 0.82); rounding = 12; position = 0, 83; halign = center; valign = center }
label { monitor =; text = cmd[update:1000] echo "$(date +"%H:%M")"; color = rgba(128, 128, 128, 0.88); font_size = 64; font_family = IBM Plex Mono; position = 0, 100; halign = center; valign = center }
label { monitor =; text = cmd[update:60000] date +"%a, %d %B"; color = rgba(128, 128, 128, 0.82); font_size = 18; font_family = IBM Plex Mono; position = 0, 40; halign = center; valign = center }

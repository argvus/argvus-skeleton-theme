# Terminal colours of the theme {{ theme.id }}: the kitty template with the 16
# ANSI colours of [ansi] in theme.toml. Delete this file and the [overrides]
# line to use the default terminal template, which has no ANSI colours.
background              {{ @bg | hex }}
foreground              {{ @fg | hex }}
cursor                  {{ @fg | hex }}
cursor_text_color       {{ @bg | hex }}
selection_foreground    {{ @fg | hex }}
selection_background    {{ @accent | mix(@bg, 0.5) | hex }}
active_tab_background   {{ @bg | mix(@fg, 0.08) | hex }}
active_tab_foreground   {{ @accent | hex }}
inactive_tab_background {{ @bg | mix(@fg, 0.04) | hex }}
inactive_tab_foreground {{ @fg | mix(@bg, 0.45) | hex }}

color0  {{ ansi.color0 | hex }}
color1  {{ ansi.color1 | hex }}
color2  {{ ansi.color2 | hex }}
color3  {{ ansi.color3 | hex }}
color4  {{ ansi.color4 | hex }}
color5  {{ ansi.color5 | hex }}
color6  {{ ansi.color6 | hex }}
color7  {{ ansi.color7 | hex }}
color8  {{ ansi.color8 | hex }}
color9  {{ ansi.color9 | hex }}
color10 {{ ansi.color10 | hex }}
color11 {{ ansi.color11 | hex }}
color12 {{ ansi.color12 | hex }}
color13 {{ ansi.color13 | hex }}
color14 {{ ansi.color14 | hex }}
color15 {{ ansi.color15 | hex }}

background_opacity 0.90
